<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <!-- 背景层 -->
  <div class="bg"></div>

  <!-- 顶部导航 -->
  <header>
    <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/' | relative_url }}#posts">文章</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>© {{ site.time | date: '%Y' }} {{ site.author }} · 由 <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a> 驱动</p>
    <p><a href="{{ '/feed.xml' | relative_url }}">订阅 RSS</a></p>
  </footer>
</body>
</html>
